name: Release and publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'xiangsam/pi-rex-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11

      - name: Validate release version
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME;
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== 'pi-rex-adapter' || tag !== `v${version}`) {
            throw new Error(`Expected pi-rex-adapter release tag v${version}; got ${tag}`);
          }
          const prerelease = version.split('+')[0].includes('-');
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${prerelease}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${prerelease ? 'next' : 'latest'}\n`);
          NODE

      # This package has no dependencies, so no install or build step is needed.
      - name: Run release checks
        run: npm run prepublishOnly

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; continuing to npm."
          else
            args=("$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG")
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease --latest=false)
            fi
            gh release create "${args[@]}"
          fi

      # The release checks above already ran prepublishOnly.
      - name: Publish to npm with OIDC
        run: npm publish --ignore-scripts --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
